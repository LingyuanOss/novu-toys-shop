<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVU TOYS | Product</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">NOVU<span>TOYS</span></div>
      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="artists.html">Artists</a>
      </nav>
      <div class="header-icons">
        <a href="cart.html">购物车<span class="cart-badge">0</span></a>
      </div>
    </header>

    <section class="product-detail">
      <div class="product-image">
        <!-- 优化：图片包裹层，包含占位提示 -->
        <div class="image-wrapper" style="border-radius: 20px">
          <div class="img-placeholder">商品图片预留位</div>
          <img
            id="productImage"
            src=""
            alt="Product"
            onerror="this.style.display = 'none'"
          />
        </div>
      </div>
      <div class="product-content">
        <span id="productTag" class="product-tag"></span>
        <h1 id="productName">加载中...</h1>
        <p class="artist">By <span id="productArtist"></span></p>
        <h2 id="productPrice"></h2>

        <div
          class="rating"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
          "
        >
          <span style="color: gold; font-size: 20px">★★★★★</span>
          <span style="color: #888">(12条评价)</span>
          <button
            id="favBtn"
            style="
              background: none;
              border: 1px solid #ddd;
              padding: 5px 15px;
              border-radius: 20px;
              margin-left: auto;
              cursor: pointer;
            "
          >
            ☆ 收藏
          </button>
        </div>

        <div class="product-meta">
          <p>分类: <span id="productCategory"></span></p>
          <p>材质: <span id="productMaterial"></span></p>
          <p>尺寸: <span id="productSize"></span></p>
          <p>库存: <span id="productStock"></span></p>
        </div>
        <p id="productDescription" class="description"></p>

        <div class="purchase-area">
          <input type="number" id="quantity" value="1" min="1" max="99" />
          <button id="addCartButton">加入购物车</button>
        </div>
      </div>
    </section>

    <!-- 相关推荐板块 -->
    <section class="related" style="padding: 40px 80px">
      <h2 style="margin-bottom: 20px">相关推荐</h2>
      <div
        class="product-container"
        id="relatedProducts"
        style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px"
      ></div>
    </section>

    <footer class="footer">
      <div class="footer-logo">NOVU TOYS</div>
      <p>© 2026 NOVU TOYS</p>
    </footer>

    <script src="assets/js/global.js"></script>
    <script src="assets/js/cart-core.js"></script>
    <script src="assets/js/product-detail.js"></script>
  </body>
</html>
